name: vinta_ads
description: "VINTA halal ad network for Flutter: banner, interstitial, app open, rewarded, rewarded interstitial and native ads."
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: org.view2earn.vinta.flutter
        pluginClass: VintaAdsPlugin
